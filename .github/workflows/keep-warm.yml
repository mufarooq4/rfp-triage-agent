# Optional: pings the app every 10 minutes so a warm instance is ready (useful on hosts that sleep).
# and waking it takes about a minute. This free scheduled job pings the health
# endpoint every 10 minutes so the app is awake when someone opens the link.
# Set the repository variable APP_URL (Settings -> Secrets and variables -> Actions -> Variables).
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then echo "APP_URL not set"; exit 0; fi
          curl -fsS --max-time 90 "${{ vars.APP_URL }}/api/health" || echo "ping failed (app may be waking up)"
