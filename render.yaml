# Render Blueprint: Render > New > Blueprint > pick this repo > enter GEMINI_API_KEY > Apply.
services:
  - type: web
    name: rfp-triage-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # entered in the Render dashboard, never stored in git
