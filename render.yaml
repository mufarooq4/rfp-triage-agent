# Optional alternative to Hugging Face Spaces. Render > New > Blueprint > pick this repo.
services:
  - type: web
    name: rfp-triage-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set the value in the Render dashboard, never in git
